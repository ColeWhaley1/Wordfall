name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test game logic
        run: swift test

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project Wordfall.xcodeproj \
            -scheme Wordfall \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
